<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T.cube - Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="tictactoe.css">
    <style>
        /* Standalone Settings Layout */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-y: auto !important;
        }
    </style>
</head>

<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="card settings-card" style="width: 100%; max-width: 400px; padding: 2.5rem; border-radius: 20px;">
        <div class="logo-container" style="display: flex; justify-content: center; margin-bottom: 0.5rem;">
            <img src="logo.png" alt="T.cube Logo" style="width: 120px; height: auto;">
        </div>
        <h1 class="title">Settings</h1>
        <p class="subtitle">Manage Account Details</p>

        <div id="must-change-banner" style="display: none; background: rgba(255, 179, 0, 0.15); border: 1px solid #ffb300;
            border-radius: 12px; padding: 12px 14px; margin-bottom: 1rem; line-height: 1.5; color: var(--text);">
            You're using a temporary password. Enter it as your <strong>Current Password</strong> below and choose a new one.
        </div>

        <div class="settings-content">
            <form id="form-settings" onsubmit="handleUpdateSettings(event)">
                <div class="form-group">
                    <label>Email (Read Only)</label>
                    <input type="email" id="settings-email" disabled>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="settings-username" required minlength="3" maxlength="20">
                </div>
                <div id="settings-status" class="auth-success" style="color: var(--wood-light)"></div>
                <button type="submit" class="btn btn-primary btn-full">
                    <span class="btn-text" style="align-items: center"><strong>Save Changes</strong></span>
                </button>
            </form>

            <div style="height: 16px;"></div>
            <hr style="border: none; border-top: 1px solid var(--wood-border); margin: 15px 0;">

            <form id="form-password" onsubmit="handleChangePassword(event)">
                <div class="form-group">
                    <label>Current Password</label>
                    <input type="password" id="pw-current" required autocomplete="current-password">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="pw-new" required minlength="6" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="pw-confirm" required minlength="6" autocomplete="new-password">
                </div>
                <div id="password-status" class="auth-success" style="color: var(--wood-light)"></div>
                <button type="submit" class="btn btn-primary btn-full" id="pw-submit">
                    <span class="btn-text" style="align-items: center"><strong>Change Password</strong></span>
                </button>
            </form>

            <div style="height: 16px;"></div>
            <hr style="border: none; border-top: 1px solid var(--wood-border); margin: 15px 0;">

            <div class="settings-row" style="display: flex; justify-content: space-between; align-items: center;">
                <span style="color: var(--text); font-weight: 500;">Appearance</span>
                <button id="settings-theme-toggle" class="btn btn-ghost" onclick="toggleTheme()"
                    style="padding: 6px 12px;" type="button">Toggle Theme</button>
            </div>
        </div>

        <button class="btn btn-secondary btn-full" onclick="window.location.href='tictactoe.html'"
            style="margin-top: 1.5rem;">
            <span class="btn-text" style="justify-content: center; width: 100%;"><strong>Back to Menu</strong></span>
        </button>
    </div>

    <!-- Minimal JS to handle the Settings logic without the full game logic -->
    <script src="apiClient.js"></script>
    <script>
        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('light-theme');
            localStorage.setItem('ttt_theme', body.classList.contains('light-theme') ? 'light' : 'dark');
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('ttt_theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
            }
        }
        initTheme();

        window.onload = async function () {
            if (!getToken()) {
                window.location.href = 'tictactoe.html';
                return;
            }
            try {
                const { user } = await apiCall('auth', 'me');
                document.getElementById('settings-email').value = user.email;
                document.getElementById('settings-username').value = user.username || '';
                if (user.mustChangePassword) {
                    document.getElementById('must-change-banner').style.display = 'block';
                    document.getElementById('pw-current').focus();
                }
            } catch (e) {
                if (e.status === 401) {
                    setToken(null);
                    window.location.href = 'tictactoe.html';
                }
            }
        };

        async function handleUpdateSettings(e) {
            e.preventDefault();
            const username = document.getElementById('settings-username').value.trim();
            const statusEl = document.getElementById('settings-status');

            try {
                await apiCall('auth', 'update_profile', { username });
                statusEl.style.color = 'var(--wood-light)';
                statusEl.textContent = 'Settings saved successfully!';
            } catch (err) {
                statusEl.style.color = '#ff6b6b';
                statusEl.textContent = err.message || 'Failed to save. Try again.';
            }

            setTimeout(() => {
                statusEl.textContent = '';
            }, 3000);
        }

        async function handleChangePassword(e) {
            e.preventDefault();
            const currentPassword = document.getElementById('pw-current').value;
            const newPassword = document.getElementById('pw-new').value;
            const confirm = document.getElementById('pw-confirm').value;
            const statusEl = document.getElementById('password-status');
            const btn = document.getElementById('pw-submit');

            if (newPassword !== confirm) {
                statusEl.style.color = '#ff6b6b';
                statusEl.textContent = 'New passwords do not match.';
                return;
            }

            btn.disabled = true;
            try {
                const { token } = await apiCall('auth', 'change_password', { currentPassword, newPassword });
                setToken(token); // keep this device logged in; other devices are logged out
                document.getElementById('form-password').reset();
                statusEl.style.color = 'var(--wood-light)';
                statusEl.textContent = 'Password changed. Other devices have been logged out.';
                if (document.getElementById('must-change-banner').style.display === 'block') {
                    setTimeout(() => { window.location.href = 'tictactoe.html'; }, 1200);
                }
            } catch (err) {
                statusEl.style.color = '#ff6b6b';
                statusEl.textContent = err.message || 'Failed to change password.';
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
